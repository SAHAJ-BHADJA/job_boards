name: Daily job scrape + deploy dashboard

on:
  schedule:
    # 13:00 UTC daily (= 18:30 IST). Change to taste; cron is UTC.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write   # commit the updated data/jobs.csv back to the repo
  pages: write      # deploy to GitHub Pages
  id-token: write   # required by the Pages deploy action

concurrency:
  group: jobbot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs: {}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scraper (scrape -> DB -> CSV/XLSX -> dashboard)
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: python runner.py

      - name: Commit updated data/jobs.csv
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.csv
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: daily job update ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
